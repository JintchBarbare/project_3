<div class="cart-container">
  <h1>თქვენი კალათა</h1>

  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>თქვენი კალათა ამჟამად ცარიელია.</p>
    <a routerLink="/shop" class="btn-primary">მენიუში დაბრუნება</a>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-content">
    <div class="cart-items-list">
      <div class="cart-item" *ngFor="let item of cartItems">
        <img [src]="item.image" [alt]="item.name" class="cart-item-img">
        <div class="cart-item-info">
          <h3>{{ item.name }}</h3>
          <p class="item-price">{{ item.price }} ₾</p>
        </div>
        
        <div class="quantity-controls">
          <button (click)="decreaseQuantity(item)">-</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increaseQuantity(item)">+</button>
        </div>

        <button (click)="removeItem(item.id)" class="btn-remove">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="cart-summary">
      <h2>შეკვეთის დეტალები</h2>
      <div class="summary-row">
        <span>სულ ჯამი:</span>
        <span class="total-amount">{{ totalPrice }} ₾</span>
      </div>
      <button class="btn-checkout" (click)="clearCart()">შეკვეთის გაფორმება</button>
    </div>
  </div>
</div>
